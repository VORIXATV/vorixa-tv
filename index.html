<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORIXA TV - البث المباشر</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 30px;
            min-height: 100vh;
        }

        /* شاشة حماية الكود */
        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .auth-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .auth-box h2 {
            color: var(--accent-color);
            margin-bottom: 10px;
            font-size: 22px;
        }

        .auth-box p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .auth-box input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }

        .auth-box input:focus {
            border-color: var(--accent-color);
        }

        .auth-box button {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .auth-box button:hover {
            opacity: 0.9;
        }

        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* زر قناة التليجرام بداخل شاشة الحماية */
        .telegram-btn-auth {
            display: inline-block;
            margin-top: 15px;
            color: #38bdf8;
            font-size: 13px;
            text-decoration: none;
        }

        /* الهيدر العلوي للموقع */
        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .tg-header-btn {
            background: #229ED9;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            display: none; /* مخفي لحين إدخال الكود الصحيح */
        }

        /* مشغل الفيديو */
        .player-container {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            border-right: 4px solid var(--accent-color);
            padding-right: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .channel-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .channel-card:hover {
            transform: translateY(-3px);
            background: #334155;
        }

        .channel-card h4 {
            font-size: 14px;
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <!-- شاشة إدخال الكود -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>VORIXA TV</h2>
            <p>الموقع محمي بكود دخول. احصل على الكود الجديد من قناتنا على التليجرام للمتابعة.</p>
            <input type="password" id="passcode" placeholder="أدخل كود الدخول هنا..." />
            <button onclick="checkPassword()">دخول للموقع</button>
            <div id="error" class="error-msg">الكود غير صحيح، حاول مرة أخرى!</div>
            <br>
            <a href="https://t.me/se_22m" target="_blank" class="telegram-btn-auth">📢 انضم لقناة التليجرام للحصول على الكود</a>
        </div>
    </div>

    <!-- الهيدر -->
    <header>
        <h1>VORIXA TV</h1>
        <a href="https://t.me/se_22m" target="_blank" class="tg-header-btn">قناة التليجرام</a>
    </header>

    <!-- محتوى الموقع الأساسي -->
    <div class="container" id="main-content">
        <!-- مشغل البث الرئيسي -->
        <div class="player-container">
            <iframe id="main-player" src="about:blank" allowfullscreen></iframe>
        </div>

        <!-- قائمة القنوات -->
        <h3 class="section-title">القنوات المباشرة</h3>
        <div class="grid">
            <div class="channel-card" onclick="changeStream('https://blcco.linkip.org/live/3461_.m3u8')">
                <h4>beIN Sports 1</h4>
            </div>
            <div class="channel-card" onclick="changeStream('رابط_البث_2')">
                <h4>beIN Sports 2</h4>
            </div>
            <div class="channel-card" onclick="changeStream('رابط_البث_3')">
                <h4>SSC SPORT</h4>
            </div>
        </div>
    </div>

    <script>
        // *** تقدر تغير الكود من هنا بكل سهولة وقت ما تحب ***
        const correctCode = "23"; 

        function checkPassword() {
            const enteredCode = document.getElementById('passcode').value;
            const errorMsg = document.getElementById('error');
            const authScreen = document.getElementById('auth-screen');
            const mainContent = document.getElementById('main-content');

            if (enteredCode === correctCode) {
                authScreen.style.display = 'none';
                mainContent.style.display = 'block';
            } else {
                errorMsg.style.display = 'block';
            }
        }

        function changeStream(url) {
            const player = document.getElementById('main-player');
            player.src = url;
        }
    </script>
</body>
</html>
