<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORIXA TV - البث المباشر</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-gold: #d4af37;
            --accent-gold-hover: #f3e5ab;
            --text-color: #f8fafc;
            --text-muted: #c5a059;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 30px;
            min-height: 100vh;
        }

        /* شاشة حماية الكود - أسود وذهبي */
        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .auth-box {
            background: #111111;
            padding: 35px 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
            border: 1px solid var(--accent-gold);
        }

        .auth-box h2 {
            color: var(--accent-gold);
            margin-bottom: 10px;
            font-size: 26px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .auth-box p {
            font-size: 14px;
            color: #d1d5db;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .auth-box input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--accent-gold);
            background: #000;
            color: var(--accent-gold);
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            font-weight: bold;
        }

        .auth-box input:focus {
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .auth-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-box button:hover {
            background: linear-gradient(135deg, #f3e5ab, #d4af37);
            transform: translateY(-2px);
        }

        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        .telegram-btn-auth {
            display: inline-block;
            margin-top: 18px;
            color: var(--accent-gold);
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
        }

        .telegram-btn-auth:hover {
            color: var(--accent-gold-hover);
            text-decoration: underline;
        }

        /* الهيدر العلوي للموقع */
        header {
            background-color: #111111;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: var(--accent-gold);
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        .tg-header-btn {
            background: linear-gradient(135deg, #229ED9, #0088cc);
            color: #fff;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            display: none; /* مخفي لحين إدخال الرمز الصحيح */
        }

        /* مشغل الفيديو */
        .player-container {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 25px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--accent-gold);
            border-right: 4px solid var(--accent-gold);
            padding-right: 10px;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .channel-card {
            background: #111111;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(212, 175, 55, 0.25);
        }

        .channel-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-gold);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
            background: #181818;
        }

        .channel-card h4 {
            font-size: 14px;
            color: var(--text-color);
            font-weight: bold;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- شاشة إدخال الكود -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>VORIXA TV</h2>
            <p>الموقع محمي بكود دخول. احصل على الكود الجديد من قناتنا على التليجرام للمتابعة.</p>
            <input type="password" id="passcode" placeholder="أدخل كود الدخول هنا..." />
            <button onclick="checkPassword()">دخول للموقع</button>
            <div id="error" class="error-msg">الكود غير صحيح، حاول مرة أخرى!</div>
            <br>
            <a href="https://t.me/se_22m" target="_blank" class="telegram-btn-auth">📢 انضم لقناة التليجرام للحصول على الكود</a>
        </div>
    </div>

    <!-- الهيدر -->
    <header>
        <h1>VORIXA TV</h1>
        <a href="https://t.me/se_22m" target="_blank" class="tg-header-btn">قناة التليجرام</a>
    </header>

    <!-- محتوى الموقع الأساسي -->
    <div class="container" id="main-content">
        <!-- مشغل البث الرئيسي -->
        <div class="player-container">
            <iframe id="main-player" src="about:blank" allowfullscreen></iframe>
        </div>

        <!-- قائمة القنوات المحدثة -->
        <h3 class="section-title">القنوات المباشرة</h3>
        <div class="grid">
            <div class="channel-card" onclick="changeStream('https://web.aboozayed.web.id/1/index.m3u8')">
                <h4>BEIN SPORTS 1</h4>
            </div>
            <div class="channel-card" onclick="changeStream('https://blcco.linkip.org/live/3461_.m3u8')">
                <h4>ALWAN SPORTS 1</h4>
            </div>
            <div class="channel-card" onclick="changeStream('https://blcco.linkip.org/live/3460_.m3u8')">
                <h4>ALWAN SPORTS 2</h4>
            </div>
        </div>
    </div>

    <script>
        // الكود الجديد هو 23
        const correctCode = "23"; 

        function checkPassword() {
            const enteredCode = document.getElementById('passcode').value;
            const errorMsg = document.getElementById('error');
            const authScreen = document.getElementById('auth-screen');
            const mainContent = document.getElementById('main-content');

            if (enteredCode === correctCode) {
                authScreen.style.display = 'none';
                mainContent.style.display = 'block';
            } else {
                errorMsg.style.display = 'block';
            }
        }

        function changeStream(url) {
            const player = document.getElementById('main-player');
            player.src = url;
        }
    </script>
</body>
</html>
