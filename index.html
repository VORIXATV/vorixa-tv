<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060811">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<title>VORIXA PRO - ROYAL GLASS</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --bg-pure: #060811;
    --bg-sidebar: #090d1a;
    --border-line: rgba(245, 196, 81, 0.28);
    --accent-gold: #f5c451;
    --accent-secondary: #38bdf8;
    --accent-green: #10b981;
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
  }

  * {
    box-sizing: border-box;
    font-family: 'Tajawal', sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  html, body {
    background: linear-gradient(145deg, #1b0b1e 0%, #070b18 48%, #04060c 100%);
    color: var(--text-main);
    margin: 0; padding: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: row;
  }

  /* دخولية فخمة جداً (Splash Screen) تلقائية لمدة 3 ثواني */
  #splashScreen {
    position: fixed; inset: 0; background: #060811; z-index: 9999999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.25s ease;
  }
  .splash-logo-box {
    width: 92px; height: 92px;
    background: linear-gradient(135deg, #f5c451, #be123c, #0284c7);
    border-radius: 24px; display: flex; align-items: center; justify-content: center;
    font-size: 38px; color: #060811; font-weight: 900;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
    animation: pulseSplash 1.6s infinite ease-in-out;
    margin-bottom: 16px;
  }
  @keyframes pulseSplash {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  .splash-title { font-size: 25px; font-weight: 900; color: #f8fafc; letter-spacing: 2px; margin-bottom: 6px; }
  .splash-subtitle { font-size: 11px; color: var(--text-sub); font-weight: 700; letter-spacing: 0.5px; }

  /* نافذة كود التفعيل (الكود 24) */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(4, 6, 12, 0.96);
    z-index: 999999; display: none; align-items: center; justify-content: center; padding: 15px;
  }
  .auth-modal-card {
    background: #090d1a;
    border: 1px solid rgba(245, 196, 81, 0.45);
    border-radius: 18px; width: 100%; max-width: 340px; padding: 24px 20px; text-align: center;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
  }
  .auth-icon-wrap {
    width: 54px; height: 54px; background: rgba(245, 196, 81, 0.12);
    border: 1px solid rgba(245, 196, 81, 0.45); border-radius: 15px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: var(--accent-gold); margin: 0 auto 14px auto;
  }
  .telegram-join-box {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08);
    display: none; flex-direction: column; gap: 8px;
  }
  .telegram-join-btn {
    background: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.38);
    color: #e0f2fe; padding: 9px; border-radius: 9px; font-size: 11px; font-weight: 800;
    text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  }

  /* القائمة الجانبية للباقات */
  .receiver-sidebar {
    width: 260px; 
    background: var(--bg-sidebar);
    border-left: 1px solid rgba(245, 196, 81, 0.16);
    display: flex; flex-direction: column; height: 100%; flex-shrink: 0; z-index: 10;
  }
  .sidebar-header {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(245, 196, 81, 0.14);
    background: rgba(245, 196, 81, 0.04);
    display: flex; align-items: center; justify-content: center;
  }
  .brand-wrap { display: flex; align-items: center; gap: 8px; flex-direction: row-reverse; }
  .sidebar-logo {
    width: 30px; height: 30px; background: linear-gradient(135deg, #f5c451, #be123c, #0284c7);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #060811; font-weight: 900;
  }
  .sidebar-title { font-size: 13px; font-weight: 900; color: #f8fafc; }

  .bundles-menu-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .bundles-menu-list::-webkit-scrollbar { display: none; }

  .bundle-menu-item {
    width: 100%; 
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    padding: 9px 11px; display: flex; align-items: center; gap: 10px; color: #e2e8f0;
    cursor: pointer; font-size: 11px; font-weight: 800; margin-bottom: 6px; text-align: right;
    transition: background 0.1s ease, border-color 0.1s ease, color 0.1s ease;
    direction: rtl;
  }
  .bundle-menu-item:hover, .bundle-menu-item:focus { 
    background: rgba(245, 196, 81, 0.1); 
    border-color: rgba(245, 196, 81, 0.36);
    color: #fff;
    outline: none;
  }
  .bundle-menu-item.active {
    background: linear-gradient(90deg, rgba(190, 18, 60, 0.22), rgba(245, 196, 81, 0.16));
    color: #fff; 
    border-color: rgba(245, 196, 81, 0.58);
  }
  .bundle-menu-logo {
    width: 25px; height: 25px; object-fit: contain; background: rgba(255,255,255,0.03);
    border-radius: 6px; padding: 2px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.07);
  }

  /* منطقة المحتوى الرئيسية */
  .receiver-content-area {
    flex: 1; height: 100%; display: flex; flex-direction: column; background: transparent; overflow: hidden; min-width: 0;
  }

  /* شريط التحكم العلوي */
  .top-controls-bar {
    padding: 8px 16px; 
    border-bottom: 1px solid rgba(245, 196, 81, 0.14);
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 8px; 
    background: rgba(9, 13, 26, 0.92);
    direction: rtl;
  }

  .active-bundle-name { font-size: 13px; font-weight: 900; color: #f8fafc; display: flex; align-items: center; gap: 8px; }
  .active-bundle-name span {
    color: var(--accent-gold); font-size: 9px; background: rgba(245, 196, 81, 0.12);
    padding: 2px 7px; border-radius: 6px; border: 1px solid rgba(245, 196, 81, 0.28);
  }

  .search-and-tg { display: flex; align-items: center; gap: 8px; }
  
  .live-clock-badge {
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid rgba(245, 196, 81, 0.2);
    color: var(--accent-gold);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 900;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    letter-spacing: 0.4px;
  }
  .live-clock-badge i { font-size: 10px; color: var(--accent-secondary); }

  .search-box { position: relative; width: 170px; }
  .search-box input {
    width: 100%;
    background: rgba(255, 255, 255, 0.025); 
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px; padding: 7px 28px 7px 10px; color: #fff; font-size: 11px; font-weight: 700; outline: none;
    direction: rtl;
  }
  .search-box input:focus { border-color: rgba(245, 196, 81, 0.5); background: rgba(245, 196, 81, 0.06); }
  .search-box i {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--accent-gold); font-size: 10px;
  }

  .tg-btn {
    background: rgba(245, 196, 81, 0.12); 
    border: 1px solid rgba(245, 196, 81, 0.3); 
    color: #fef3c7;
    padding: 7px 12px; border-radius: 8px; font-size: 10px; font-weight: 800; text-decoration: none; white-space: nowrap;
    cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  }
  .tg-btn:hover, .tg-btn:focus { background: rgba(245, 196, 81, 0.2); border-color: rgba(245, 196, 81, 0.55); color: #fff; outline: none; }

  /* الشريط المتحرك مكبر وواضح في الأعلى */
  .marquee-top-wrapper {
    background: linear-gradient(90deg, rgba(190, 18, 60, 0.14), rgba(245, 196, 81, 0.11), rgba(2, 132, 199, 0.14));
    border: 1px solid rgba(245, 196, 81, 0.3);
    padding: 15px 0;
    overflow: hidden;
    white-space: nowrap;
    position: relative;
    margin: 10px 14px 0 14px;
    border-radius: 13px;
    flex-shrink: 0;
    direction: ltr;
  }
  .marquee-content {
    display: inline-flex;
    align-items: center;
    width: max-content;
    animation: marqueeAnimation 24s linear infinite;
    font-size: 14.5px;
    font-weight: 900;
    color: #f8fafc;
    direction: rtl;
  }
  .marquee-content span {
    margin-left: 70px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .marquee-content i { color: var(--accent-gold); }
  @keyframes marqueeAnimation {
    0% { transform: translate3d(0%, 0, 0); }
    100% { transform: translate3d(-50%, 0, 0); }
  }

  /* شعار التطبيق بوسط الصفحة */
  .hero-app-logo-card {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(245, 196, 81, 0.2);
    border-radius: 18px;
    padding: 34px 20px;
    margin: 12px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex-shrink: 0;
  }
  .hero-logo-icon {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, #f5c451, #be123c, #0284c7);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: #060811;
    margin-bottom: 14px;
  }
  .hero-brand-title {
    font-size: 18px;
    font-weight: 900;
    color: #f8fafc;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .hero-brand-subtitle {
    font-size: 10px;
    color: var(--text-sub);
    font-weight: 700;
  }

  .scrollable-grid-wrap { 
    flex: 1; 
    overflow-y: auto; 
    padding: 0 14px 14px 14px; 
    scrollbar-width: none; 
    -webkit-overflow-scrolling: touch;
  }
  .scrollable-grid-wrap::-webkit-scrollbar { display: none; }

  .channels-grid-receiver {
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
    gap: 9px;
    width: 100%;
    margin-top: 12px;
  }

  .channel-card-rec {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 11px; padding: 9px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    cursor: pointer; 
    transition: background 0.1s ease, border-color 0.1s ease;
    direction: rtl;
  }
  .channel-card-rec:hover, .channel-card-rec:focus {
    background: rgba(245, 196, 81, 0.08);
    border-color: rgba(245, 196, 81, 0.45);
    outline: none;
  }
  .ch-rec-info { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; direction: rtl; text-align: right; }
  .ch-rec-logo {
    width: 34px; height: 34px; object-fit: contain; background: rgba(255,255,255,0.03);
    border-radius: 7px; padding: 2px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.07);
  }
  .ch-rec-texts { display: flex; flex-direction: column; min-width: 0; }
  .ch-rec-title { font-size: 10px; font-weight: 800; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch-rec-sub {
    font-size: 7px; color: var(--text-sub); font-weight: 700; margin-top: 2px; display: flex; align-items: center; gap: 4px;
  }
  .live-dot {
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent-green);
  }

  .quality-badge {
    background: rgba(245, 196, 81, 0.12); color: var(--accent-gold); padding: 1px 5px; border-radius: 4px; font-size: 6px; font-weight: 900; border: 1px solid rgba(245, 196, 81, 0.25);
  }
  .ch-rec-play-btn {
    width: 27px; height: 27px; background: linear-gradient(135deg, #f5c451, #be123c); color: #060811; border-radius: 7px;
    display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0;
  }

  .toast-popup {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(8px); z-index: 9999999;
    background: #090d1a; border: 1px solid rgba(245, 196, 81, 0.5); color: #fff;
    padding: 9px 16px; border-radius: 10px; font-size: 11px; font-weight: 800;
    display: flex; align-items: center; gap: 8px; opacity: 0; transition: opacity 0.15s ease, transform 0.15s ease; pointer-events: none;
  }
  .toast-popup.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== مشغل التلفون ===== */
  #player {
    position: fixed; inset: 0; z-index: 500000;
    background: #000; display: none; flex-direction: column;
    height: 100vh; height: 100dvh; touch-action: manipulation; overscroll-behavior: contain;
  }
  #player.open { display: flex; }
  #player.fit-cover #vid { object-fit: cover; }
  #player.fit-fill #vid { object-fit: fill; }
  #player.idle { cursor: none; }
  #player.idle .player-top, #player.idle .player-bottom, #player.idle .player-center-controls { opacity: 0; pointer-events: none; }
  .player-top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 12px;
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(180deg, rgba(0,0,0,0.85), transparent);
    direction: rtl; transition: opacity 0.25s;
  }
  .player-title { flex: 1; font-size: 13px; font-weight: 900; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbtn {
    min-width: 36px; height: 36px; padding: 0 10px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.18); background: rgba(15,10,14,0.78);
    color: #fff; font-size: 12px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-weight: 800;
  }
  .pbtn:hover, .pbtn:focus { border-color: var(--accent-gold); background: rgba(245,196,81,0.2); outline: none; }
  .pbtn.close { background: rgba(190,18,60,0.88); border-color: transparent; }
  .player-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #vid { width: 100%; height: 100%; background: #000; display: block; object-fit: contain; }

  /* أزرار التوقف والتشغيل والتقديم والتأخير 10 ثواني في وسط المشغل */
  .player-center-controls {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 5; display: flex; align-items: center; justify-content: center; gap: 22px;
    direction: ltr; transition: opacity 0.25s;
  }
  .center-skip-btn {
    width: 48px; height: 48px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.22); background: rgba(15,10,14,0.72);
    color: #fff; font-size: 13px; cursor: pointer;
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-weight: 900;
  }
  .center-play-btn {
    width: 62px; height: 62px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.28); background: rgba(15,10,14,0.78);
    color: #fff; font-size: 22px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.2s, border-color 0.2s, opacity 0.2s;
  }
  #player.stream-dead .spinner { display: none !important; }
  #player.stream-dead .center-play-btn {
    background: transparent !important;
    border-color: rgba(255,255,255,0.16) !important;
    color: rgba(255,255,255,0.32) !important;
    opacity: 0.35;
  }

  .player-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
    padding: 24px 14px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(0deg, rgba(0,0,0,0.9), transparent);
    direction: rtl; transition: opacity 0.25s;
    display: flex; flex-direction: column; gap: 8px;
  }
  .ctrl-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ctrl-row.spread { justify-content: space-between; }
  .chip {
    padding: 5px 11px; border-radius: 999px; font-size: 10px; font-weight: 900; color: #e2e8f0; cursor: pointer;
    background: rgba(15,10,14,0.78); border: 1px solid rgba(255,255,255,0.18);
  }
  .chip.active { background: linear-gradient(135deg, #f5c451, #be123c); color: #060811; border-color: transparent; }
  .vol { accent-color: var(--accent-gold); width: 80px; }
  .s10 { font-size: 9px; font-weight: 900; line-height: 1; }
  .seek-row { display: flex; align-items: center; direction: ltr; width: 100%; gap: 8px; }
  .seek-row .tm { font-size: 11px; font-weight: 800; color: #e2e8f0; min-width: 44px; text-align: center; }
  #seek { flex: 1; min-width: 0; height: 22px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; }
  #seek::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--accent-gold) var(--p, 0%), rgba(255,255,255,0.28) var(--p, 0%)); }
  #seek::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: #fff; border: 2px solid var(--accent-gold); }
  #seek:disabled { opacity: 0.35; }
  .qwrap { position: relative; }
  .qmenu { display: none; position: absolute; bottom: calc(100% + 8px); right: 0; min-width: 130px; max-height: 45vh; overflow-y: auto; flex-direction: column; padding: 6px; border-radius: 12px; z-index: 8; background: rgba(9,13,26,0.97); border: 1px solid rgba(245,196,81,0.3); }
  .qmenu.on { display: flex; }
  .qitem { background: transparent; border: 1px solid transparent; color: #e2e8f0; padding: 8px 11px; margin: 2px 0; border-radius: 8px; font-size: 11px; font-weight: 800; text-align: right; cursor: pointer; display: flex; justify-content: space-between; white-space: nowrap; }
  .qitem:hover, .qitem.active { color: var(--accent-gold); background: rgba(245,196,81,0.12); }
  .qitem.active::after { content: '\2713'; margin-right: 10px; }
  .spinner {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 4; width: 78px; height: 78px; border-radius: 50%; display: none;
    border: 4px solid rgba(255,255,255,0.12); border-top-color: var(--accent-gold); animation: spin 0.9s linear infinite; pointer-events: none;
  }
  .spinner.on { display: block; }
  @keyframes spin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
  .ext-modal-card {
    background: #090d1a; border: 1px solid rgba(245,196,81,0.45); border-radius: 18px;
    width: 100%; max-width: 340px; padding: 20px; text-align: center;
  }
  .ext-btn {
    width: 100%; background: linear-gradient(135deg, #f5c451, #be123c); color: #060811;
    font-size: 11px; font-weight: 900; padding: 10px; border-radius: 10px; border: none; cursor: pointer; margin-bottom: 8px;
  }
  .ext-cancel {
    width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.16); color: var(--text-sub);
    font-size: 11px; font-weight: 800; padding: 9px; border-radius: 10px; cursor: pointer;
  }

  @media (max-width: 700px) {
    html, body { flex-direction: column; overflow: auto; position: static; height: 100vh; height: 100dvh; min-height: 100vh; }
    .receiver-sidebar { width: 100%; height: auto; border-left: none; border-bottom: 1px solid rgba(245, 196, 81, 0.16); background: var(--bg-sidebar); }
    .sidebar-header { padding: 8px 12px; }
    .bundles-menu-list { display: flex; flex-direction: row; overflow-x: auto; padding: 6px 8px; gap: 6px; }
    .bundle-menu-item { width: auto; white-space: nowrap; margin-bottom: 0; padding: 6px 10px; }
    .receiver-content-area { flex: 1; height: auto; overflow: visible; }
    .scrollable-grid-wrap { overflow: visible; }
    .marquee-top-wrapper { padding: 13px 0; }
    .marquee-content { font-size: 13.5px; }
    .search-box { width: 130px; }
    .search-box i { left: 8px; }
  }
</style>
</head>
<body>

  <!-- دخولية فخمة جداً (Splash Screen) تلقائية لمدة 3 ثواني -->
  <div id="splashScreen">
    <div class="splash-logo-box"><i class="fa-solid fa-tv"></i></div>
    <div class="splash-title">VORIXA PRO</div>
    <div class="splash-subtitle">عالمك الترفيهي والرياضي بمتناول يدك</div>
  </div>

  <!-- نافذة كود التفعيل (الكود 24) -->
  <div id="authModal" class="modal-overlay">

      let minutes = now.getMinutes();
      let seconds = now.getSeconds();

    /* =====================================================================
       التوجيه بين نسخة التلفون (المشغل المضاف) ونسخة الشاشات (AppCreator24)
       ===================================================================== */
    function handleChannelClick(ch, listContext) {
      if (!ch || !ch.streams || ch.streams.length === 0) return;

      // نسخة الشاشات: تبقى على مشغل AppCreator24 الأصلي بدون تغيير
      if (IS_TV_DEVICE) {
        launchStream(ch.streams[0].url, `${ch.name} (${ch.streams[0].q})`);
        return;
      }

      // نسخة التلفون: تشغل بالمشغل المضاف
      openMobilePlayer(ch, listContext || currentActiveBundleChannels || [ch], 0);
    }

    // مشغل الشاشات الأصلي مال AppCreator24
    function launchStream(url, displayName) {
      showToast("جاري التشغيل: " + displayName, "✨");
      window.location.href = url;
    }

    /* =====================================================================
       مشغل نسخة التلفون فقط (HLS / MPEG-TS / Native) - داعم لكل أشكال ts و m3u8
       ===================================================================== */
    const MP = { ch: null, list: null, idx: 0, hls: null, ts: null, token: 0, retries: 0, stallT: null, retryT: null, idleT: null, engT: null, fit: 0, curUrl: '' };
    const vid = document.getElementById('vid');
    const playerEl = document.getElementById('player');

    function extractTargetStreamUrl(rawUrl) {
      let u = String(rawUrl || '').trim();
      if (!u) return '';
      try {
        const parsed = new URL(u, location.href);
        const nested = parsed.searchParams.get('url') || parsed.searchParams.get('src') || parsed.searchParams.get('stream') || parsed.searchParams.get('link') || parsed.searchParams.get('play');
        if (nested && /^https?:\/\//i.test(nested.trim())) {
          u = nested.trim();
        }
      } catch (e) {}
      return u;
    }

    function buildUrlVariants(url) {
      const list = [url];
      if (location.protocol === 'https:' && /^http:\/\//i.test(url)) {
        const upgraded = url.replace(/^http:\/\//i, 'https://');
        if (upgraded !== url) list.unshift(upgraded);
      }
      return list;
    }

    function detectStreamType(url) {
      const u = extractTargetStreamUrl(url);
      if (!u) return 'auto';
      if (/(\.m3u8|m3u8_url|type=m3u8|format=m3u8|\/hls\/|playlist\.m3u8|master\.m3u8|chunklist|index\.m3u8)/i.test(u)) {
        return 'hls';
      }
      if (/(\.flv|type=flv|format=flv)/i.test(u)) {
        return 'flv';
      }
      if (/(\.ts([?#&/]|$)|mpegts|type=ts|format=ts|\/ts\/|\/mpegts\/|\/live\/[^?#]+\/[^?#]+\/\d+([?#&/]|$))/i.test(u)) {
        return 'mpegts';
      }
      if (/\.(mp4|webm|ogg|mov|m4v|mp3|aac|m4a)([?#&/]|$)/i.test(u)) {
        return 'native';
      }
      return 'auto';
    }

    function openMobilePlayer(ch, list, streamIdx = 0) {
      MP.ch = ch;
      MP.list = Array.isArray(list) && list.length ? list : [ch];
      MP.retries = 0;
      const hasMulti = MP.list.length > 1;
      document.getElementById('btnPrevCh').style.display = hasMulti ? '' : 'none';
      document.getElementById('btnNextCh').style.display = hasMulti ? '' : 'none';
      playerEl.classList.add('open');
      renderMobileChips();
      playMobileStream(streamIdx);
      enterMobileFs();
      wakeMobileControls();
    }

    function closeMobilePlayer() {
      ++MP.token;
      resetMobileStage();
      playerEl.classList.remove('open', 'idle', 'stream-dead');
      exitMobileFs();
    }

    function renderMobileChips() {
      const box = document.getElementById('streamChips');
      box.innerHTML = '';
      if (!MP.ch || !MP.ch.streams || MP.ch.streams.length < 2) return;
      MP.ch.streams.forEach((st, i) => {
        const b = document.createElement('button');
        b.className = 'chip';
        b.dataset.i = i;
        b.textContent = st.q || ('سيرفر ' + (i + 1));
        b.onclick = () => { MP.retries = 0; playMobileStream(i); };
        box.appendChild(b);
      });
    }

    function markMobileChip() {
      document.querySelectorAll('#streamChips .chip').forEach(c => c.classList.toggle('active', +c.dataset.i === MP.idx));
    }

    function playMobileStream(i) {
      MP.idx = i;
      markMobileChip();
      const st = MP.ch.streams[i];
      document.getElementById('playerTitle').textContent = MP.ch.name + (st.q && MP.ch.streams.length > 1 ? ' - ' + st.q : '');
      startMobilePlayback(st);
    }

    function restartStream() {
      MP.retries = 0;
      playMobileStream(MP.idx);
    }

    function resetMobileStage() {
      clearTimeout(MP.stallT);
      clearTimeout(MP.retryT);
      clearTimeout(MP.engT);
      if (MP.hls) { try { MP.hls.destroy(); } catch (e) {} MP.hls = null; }
      if (MP.ts) { try { MP.ts.pause(); MP.ts.unload(); MP.ts.detachMediaElement(); MP.ts.destroy(); } catch (e) {} MP.ts = null; }
      try { vid.pause(); } catch (e) {}
      vid.removeAttribute('src');
      vid.load();
      playerEl.classList.remove('stream-dead');
      document.getElementById('spinner').classList.remove('on');
      document.getElementById('qWrap').style.display = 'none';
      document.getElementById('qMenu').innerHTML = '';
      document.getElementById('qMenu').classList.remove('on');
    }

    function safeMobilePlay() {
      const p = vid.play();
      if (p && p.catch) {
        p.catch(err => {
          if (err && err.name === 'NotAllowedError') {
            vid.muted = true;
            vid.play().catch(() => {});
          }
        });
      }
    }

    function buildAttemptQueue(baseUrl, explicitType) {
      const variants = buildUrlVariants(baseUrl);
      const queue = [];

      variants.forEach(u => {
        const detected = explicitType || detectStreamType(u);
        if (detected === 'hls') {
          queue.push({ url: u, mode: 'hls', useWorker: true });
          queue.push({ url: u, mode: 'native', useWorker: false });
          queue.push({ url: u, mode: 'mpegts', useWorker: false });
        } else if (detected === 'mpegts' || detected === 'flv') {
          queue.push({ url: u, mode: 'mpegts', useWorker: true });
          queue.push({ url: u, mode: 'mpegts', useWorker: false });
          queue.push({ url: u, mode: 'hls', useWorker: true });
          queue.push({ url: u, mode: 'native', useWorker: false });
        } else if (detected === 'native') {
          queue.push({ url: u, mode: 'native', useWorker: false });
          queue.push({ url: u, mode: 'mpegts', useWorker: false });
          queue.push({ url: u, mode: 'hls', useWorker: true });
        } else {
          queue.push({ url: u, mode: 'mpegts', useWorker: true });
          queue.push({ url: u, mode: 'hls', useWorker: true });
          queue.push({ url: u, mode: 'native', useWorker: false });
        }
      });

      return queue;
    }

    function startMobilePlayback(st) {
      const my = ++MP.token;
      resetMobileStage();
      const baseUrl = extractTargetStreamUrl(st.url);
      if (!baseUrl) {
        onMobileFail();
        return;
      }
      MP.curUrl = baseUrl;

      const attempts = buildAttemptQueue(baseUrl, st.type);
      let stepIdx = 0;
      document.getElementById('spinner').classList.add('on');

      const destroyCurrentEngines = () => {
        if (MP.hls) { try { MP.hls.destroy(); } catch (e) {} MP.hls = null; }
        if (MP.ts) { try { MP.ts.pause(); MP.ts.unload(); MP.ts.detachMediaElement(); MP.ts.destroy(); } catch (e) {} MP.ts = null; }
        vid.onerror = null;
      };

      const runNextAttempt = () => {
        if (my !== MP.token) return;
        clearTimeout(MP.engT);
        if (stepIdx >= attempts.length) {
          return onMobileFail();
        }

        const item = attempts[stepIdx++];
        MP.curUrl = item.url;
        destroyCurrentEngines();
        MP.retries = 0;

        MP.engT = setTimeout(() => {
          if (my !== MP.token) return;
          if (vid.readyState >= 2 && !vid.paused) {
            clearTimeout(MP.engT);
            return;
          }
          runNextAttempt();
        }, 11000);

        if (item.mode === 'hls') {
          if (window.Hls && Hls.isSupported()) {
            const h = new Hls({
              lowLatencyMode: false,
              enableWorker: item.useWorker,
              maxBufferLength: 60,
              maxMaxBufferLength: 120,
              backBufferLength: 30,
              liveSyncDurationCount: 4,
              fragLoadingTimeOut: 15000,
              fragLoadingMaxRetry: 3,
              fragLoadingRetryDelay: 1000,
              manifestLoadingTimeOut: 12000,
              manifestLoadingMaxRetry: 3,
              manifestLoadingRetryDelay: 1000,
              levelLoadingTimeOut: 12000,
              levelLoadingMaxRetry: 3,
              levelLoadingRetryDelay: 1000
            });
            MP.hls = h;
            h.loadSource(item.url);
            h.attachMedia(vid);
            let mediaRec = 0;
            h.on(Hls.Events.MANIFEST_PARSED, () => {
              if (my !== MP.token) return;
              buildMobileQualities(h);
              safeMobilePlay();
            });
            h.on(Hls.Events.LEVEL_SWITCHED, () => {
              if (my === MP.token) updMobileQuality(h);
            });
            h.on(Hls.Events.ERROR, (ev, data) => {
              if (my !== MP.token || !data.fatal) return;
              if (data.type === Hls.ErrorTypes.MEDIA_ERROR && mediaRec++ < 2) {
                h.recoverMediaError();
                safeMobilePlay();
                return;
              }
              runNextAttempt();
            });
          } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
            vid.src = item.url;
            safeMobilePlay();
            vid.onerror = () => runNextAttempt();
          } else {
            runNextAttempt();
          }
        } else if (item.mode === 'mpegts') {
          if (window.mpegts && mpegts.getFeatureList().mseLivePlayback) {
            const isFlv = /\.flv([?#&/]|$)|type=flv|format=flv/i.test(item.url);
            const t = mpegts.createPlayer({
              type: isFlv ? 'flv' : 'mpegts',
              isLive: true,
              hasAudio: true,
              hasVideo: true,
              cors: true,
              url: item.url
            }, {
              enableWorker: item.useWorker,
              enableStashBuffer: true,
              stashInitialSize: 512 * 1024,
              lazyLoad: false,
              deferLoadAfterSourceOpen: false,
              fixAudioTimestampGap: true,
              liveBufferLatencyChasing: false,
              liveBufferLatencyMaxLatency: 10.0,
              liveBufferLatencyMinRemain: 2.0,
              autoCleanupSourceBuffer: true,
              autoCleanupMaxBackwardDuration: 60,
              autoCleanupMinBackwardDuration: 30,
              reuseRedirectedURL: true
            });
            MP.ts = t;
            t.attachMediaElement(vid);
            t.load();
            safeMobilePlay();
            t.on(mpegts.Events.ERROR, () => {
              if (my !== MP.token) return;
              runNextAttempt();
            });
          } else {
            runNextAttempt();
          }
        } else {
          vid.removeAttribute('src');
          vid.src = item.url;
          safeMobilePlay();
          vid.onerror = () => runNextAttempt();
        }
      };

      runNextAttempt();
    }

    function buildMobileQualities(h) {
      const wrap = document.getElementById('qWrap');
      const menu = document.getElementById('qMenu');
      if (!h.levels || h.levels.length < 2) { wrap.style.display = 'none'; return; }
      menu.innerHTML = '';
      const addItem = (val, label) => {
        const btn = document.createElement('button');
        btn.className = 'qitem';
        btn.dataset.l = val;
        btn.textContent = label;
        btn.onclick = () => {
          h.currentLevel = val;
          menu.classList.remove('on');
          updMobileQuality(h);
          showToast(val === -1 ? 'الجودة: تلقائي' : 'الجودة: ' + label, '🎞️');
        };
        menu.appendChild(btn);
      };
      addItem(-1, 'تلقائي');
      const seen = new Set();
      h.levels.map((l, i) => i).sort((a, b) => (h.levels[b].height || 0) - (h.levels[a].height || 0)).forEach(i => {
        const lbl = h.levels[i].height ? h.levels[i].height + 'p' : Math.round((h.levels[i].bitrate || 0) / 1000) + 'k';
        if (seen.has(lbl)) return;
        seen.add(lbl);
        addItem(i, lbl);
      });
      wrap.style.display = '';
      updMobileQuality(h);
    }

    function updMobileQuality(h) {
      if (!h || !h.levels || !h.levels.length) return;
      const auto = h.autoLevelEnabled;
      const cur = h.currentLevel;
      const activeVal = auto ? -1 : cur;
      const curLbl = h.levels[cur] ? (h.levels[cur].height ? h.levels[cur].height + 'p' : Math.round((h.levels[cur].bitrate || 0) / 1000) + 'k') : 'تلقائي';
      document.getElementById('qLabel').textContent = auto ? 'تلقائي' : curLbl;
      document.querySelectorAll('#qMenu .qitem').forEach(btn => {
        btn.classList.toggle('active', +btn.dataset.l === activeVal);
      });
    }

    function toggleQMenu() {
      document.getElementById('qMenu').classList.toggle('on');
    }

    function onMobileFail() {
      document.getElementById('spinner').classList.remove('on');
      clearTimeout(MP.stallT);
      clearTimeout(MP.engT);
      playerEl.classList.add('stream-dead');
      document.getElementById('btnPlay').innerHTML = '<i class="fa-solid fa-play"></i>';
    }

    vid.addEventListener('waiting', () => {
      if (playerEl.classList.contains('stream-dead')) return;
      document.getElementById('spinner').classList.add('on');
      clearTimeout(MP.stallT);
      MP.stallT = setTimeout(() => {
        if (playerEl.classList.contains('open') && vid.readyState < 3) {
          if (MP.hls) {
            try { MP.hls.startLoad(); safeMobilePlay(); } catch (e) {}
          } else if (MP.ts) {
            try { safeMobilePlay(); } catch (e) {}
          }
        }
      }, 15000);
    });
    vid.addEventListener('progress', () => {
      if (vid.readyState >= 3) {
        clearTimeout(MP.stallT);
        document.getElementById('spinner').classList.remove('on');
      }
    });
    vid.addEventListener('playing', () => {
      clearTimeout(MP.stallT);
      clearTimeout(MP.engT);
      playerEl.classList.remove('stream-dead');
      document.getElementById('spinner').classList.remove('on');
      MP.retries = 0;
      document.getElementById('btnPlay').innerHTML = '<i class="fa-solid fa-pause"></i>';
    });
    vid.addEventListener('pause', () => { document.getElementById('btnPlay').innerHTML = '<i class="fa-solid fa-play"></i>'; });
    vid.addEventListener('canplay', () => {
      clearTimeout(MP.stallT);
      playerEl.classList.remove('stream-dead');
      document.getElementById('spinner').classList.remove('on');
      if (vid.paused) safeMobilePlay();
    });
    document.getElementById('volRange').addEventListener('input', e => {
      vid.volume = +e.target.value;
      vid.muted = vid.volume === 0;
      syncMobileMute();
    });

    function togglePlay() {
      if (playerEl.classList.contains('stream-dead')) return;
      if (vid.paused) safeMobilePlay(); else vid.pause();
    }
    function toggleMute() { vid.muted = !vid.muted; syncMobileMute(); }
    function syncMobileMute() {
      document.getElementById('btnMute').innerHTML = `<i class="fa-solid ${vid.muted || vid.volume === 0 ? 'fa-volume-xmark' : 'fa-volume-high'}"></i>`;
    }

    function chStep(dir) {
      if (!MP.list || MP.list.length < 2) return;
      const curIdx = MP.list.indexOf(MP.ch);
      const nextCh = MP.list[((curIdx >= 0 ? curIdx : 0) + dir + MP.list.length) % MP.list.length];
      showToast(nextCh.name, '📺');
      openMobilePlayer(nextCh, MP.list, 0);
    }

    function skip(sec) {
      if (!isFinite(vid.duration)) {
        showToast('هذا البث المباشر لا يدعم التقديم', 'ℹ️');
        return;
      }
      vid.currentTime = Math.min(vid.duration - 0.2, Math.max(0, vid.currentTime + sec));
      wakeMobileControls();
    }

    function goLive() {
      if (MP.hls && MP.hls.liveSyncPosition) vid.currentTime = MP.hls.liveSyncPosition;
      else restartStream();
      if (vid.paused) safeMobilePlay();
    }

    function fmtMobileTime(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(r).padStart(2, '0');
    }

    function updMobileSeek() {
      if (!playerEl.classList.contains('open') || playerEl.classList.contains('idle')) return;
      const bar = document.getElementById('seek');
      const live = !isFinite(vid.duration);
      document.getElementById('btnLive').style.display = live ? '' : 'none';
      if (live) {
        bar.disabled = true;
        document.getElementById('tCur').textContent = '';
        document.getElementById('tDur').textContent = 'مباشر';
      } else {
        const d = vid.duration || 0;
        bar.disabled = !d;
        const pct = d ? Math.max(0, Math.min(100, (vid.currentTime / d) * 100)) : 0;
        bar.value = Math.round(pct * 10);
        bar.style.setProperty('--p', pct + '%');
        document.getElementById('tCur').textContent = fmtMobileTime(vid.currentTime);
        document.getElementById('tDur').textContent = fmtMobileTime(d);
      }
    }
    ['timeupdate', 'durationchange', 'loadedmetadata'].forEach(ev => vid.addEventListener(ev, updMobileSeek));

    function cycleFit() {
      MP.fit = (MP.fit + 1) % 3;
      playerEl.classList.remove('fit-cover', 'fit-fill');
      if (MP.fit === 1) playerEl.classList.add('fit-cover');
      else if (MP.fit === 2) playerEl.classList.add('fit-fill');
      showToast(['الحجم الأصلي', 'تكبير', 'تمديد'][MP.fit], '🔳');
    }

    async function enterMobileFs() {
      try {
        const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
        if (req) await req.call(document.documentElement);
      } catch (e) {}
      try {
        if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
      } catch (e) {}
    }

    function exitMobileFs() {
      try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
      try {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        }
      } catch (e) {}
    }

    function toggleFullscreen() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {}
      } else {
        enterMobileFs();
      }
    }

    async function togglePip() {
      try {
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else await vid.requestPictureInPicture();
      } catch (e) {
        showToast('النافذة العائمة غير مدعومة هنا', 'ℹ️');
      }
    }

    function openExtModal() { document.getElementById('extModal').style.display = 'flex'; }
    function closeExtModal() { document.getElementById('extModal').style.display = 'none'; }
    function openExternal(kind) {
      const m = String(MP.curUrl || '').match(/^(https?):\/\/([^#]*)/i);
      if (!m) { showToast('الرابط لا يدعم التشغيل الخارجي', '⚠️'); closeExtModal(); return; }
      const pkg = kind === 'vlc' ? 'org.videolan.vlc' : kind === 'mx' ? 'com.mxtech.videoplayer.ad' : '';
      const fb = pkg ? 'S.browser_fallback_url=' + encodeURIComponent('https://play.google.com/store/apps/details?id=' + pkg) + ';' : '';
      closeExtModal();
      location.href = 'intent://' + m[2] + '#Intent;scheme=' + m[1].toLowerCase() + ';action=android.intent.action.VIEW;type=video/*;' + (pkg ? 'package=' + pkg + ';' : '') + fb + 'end';
    }

    function wakeMobileControls() {
      playerEl.classList.remove('idle');
      clearTimeout(MP.idleT);
      updMobileSeek();
      MP.idleT = setTimeout(() => {
        if (playerEl.classList.contains('open')) {
          playerEl.classList.add('idle');
        }
      }, 3500);
    }
    ['mousemove', 'touchstart', 'click'].forEach(ev => playerEl.addEventListener(ev, wakeMobileControls, { passive: true }));

    function showToast(msg, icon = "✨") {
      const t = document.getElementById('toastNotification');
      document.getElementById('toastMsg').innerText = msg;
      document.getElementById('toastIcon').innerText = icon;
      t.classList.add('show');
      setTimeout(() => { t.classList.remove('show'); }, 1800);
    }
  </script>
</body>
